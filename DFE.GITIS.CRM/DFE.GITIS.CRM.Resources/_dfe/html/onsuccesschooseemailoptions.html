<html>

<head>
    <link rel="stylesheet" href="../css/getorclosephonecallcontrols.css">
    <script src="../javascript/jquery-3.3.1.min.js"></script>
    <script src="../javascript/utils.js"></script>
    <script src="../javascript/dataservices.js"></script>
    <script src="../javascript/phonecall_form_outgoing.js"></script>
    <script type="text/jscript">
        //Create a global variable for the cti paths we will retrieve in a later query
        var config = {};

        // in case the document is already rendered
        if (document.readyState != 'loading') onPageReady();
        // modern browsers
        else if (document.addEventListener) document.addEventListener('DOMContentLoaded', onPageReady);
        // IE <= 8
        else document.attachEvent('onreadystatechange', function () {
            if (document.readyState == 'complete') onPageReady();
        });

        function onPageReady() {
            debugger;
            var utils = dfe_common.utils(parent);
            var data = dfe_common.data(parent);
            config = data.getConfigByName("GITIS");

            if (config) {
                console.log(config);
            } else {
                alert("Error occured to get config data");
            }

            // build the email templates option list
            var filteredEmailList = getValidEmailTemplates(data, config);
            if(filteredEmailList)
            {
                kvpList = new Array();
                $.each(filteredEmailList, function(index,value)
                {
                    kvpList[index] = [];
                    kvpList[index].text = value.title;
                    kvpList[index].value = value.templateid;
                });

                addOptionsToDropDownList("selectEmailTemplate", kvpList);
            }

            // build the discussion points list
            if(config.dfe_emailtemplatechecklistpoints)
            {
                var discussionPointsArray = config.dfe_emailtemplatechecklistpoints.split(";");
                var kvpList = new Array();
                $.each(discussionPointsArray, function(index,value){
                    kvpList[index] = [];
                    kvpList[index].text = value;
                    kvpList[index].value = null;
                });

                addOptionsToDropDownList("selectDiscussionPoints", kvpList);
            }


            $('#selectEmailTemplate').change(onEmailTemplateSelect);
            $('#selectDiscussionPoints').change(onDataCaptureSelect);
        }

        function getValidEmailTemplates(data, config)
        {
            debugger;
            var allValidEmailTemplates = data.getAllEmailTemplates();
            var arrayOfEmailTemplateNamesFromConfig = config.dfe_emailtemplatechecklist.split(";");
            var filteredList =  allValidEmailTemplates.value.filter(a => arrayOfEmailTemplateNamesFromConfig.some(b => a.title === b));
            return filteredList;
        }

        function disableButton(buttonId) {
            //Disables the state of the button for any buttonId passed in and sets the .css class appropriately too
            document.getElementById(buttonId).disabled = true;
            document.getElementById(buttonId).classList.remove('button');
            document.getElementById(buttonId).classList.add('disabledButton');
        }

        function disableButtons()
        {
            disableButton("DFE-btn-ConfirmDataCapture");
            disableButton("DFE-btn-ConfirmDataCapture_1");
        }

        function enableButton(buttonId) {
            //Enables the state of the button for any buttonId passed in and sets the .css class appropriately too
            document.getElementById(buttonId).disabled = false;
            document.getElementById(buttonId).classList.remove('disabledButton');
            document.getElementById(buttonId).classList.add('button');
        }

        function isDropDownsValid()
        {
            var templates = $('#selectEmailTemplate').find(":selected").text();
            var discussionPoints = $('#selectDiscussionPoints').find(":selected").text();

            if(templates == "" || discussionPoints == "")
            {
                return false;
            }
            return true;
        }

        function closephonecall_onClick(generate) {

            //Set the Call outcome code field as visible - need to know if this is from the inbound or outbound phone call form
            var utils = dfe_common.utils(parent);
            console.log(utils.getAttributeValue("directioncode"));

            if(generate == null || generate == "" || generate == false)
            {
                utils.setAttributeValue("dfe_selecteddiscussionpoints", null);
                utils.setAttributeValue("dfe_selectedemailtemplate", null);
            } else
            {
                if(!isDropDownsValid())
                {
                    alert("Please select an email template and discussion points!");
                    return false;
                }
            }

            disableButtons();

            if (utils.getAttributeValue("directioncode")) {
                utils.setVisible("dfe_calloutcomecodeoutbound", true);
                //set the Close button to disabled now
                var formType = utils.getFormType();

            } else {
                var callFrom = utils.getAttributeValue("from");
                if (callFrom && callFrom.length > 0) {
                    //set the Close button to disabled now
                    utils.setVisible("dfe_calloutcomecodeinbound", true);
                    //this is an Inbound call
                    //07/01/2020 - also add in the Actual End time and start times if they are blank
                    //Check if the call start and end times are filled in and provide the current time value if not.
                    var currentTime = new Date();
                    var actualEnd = utils.getAttributeValue("actualend");
                    if (actualEnd == null) {
                        utils.setAttributeValue("actualend", currentTime);
                    }
                    var actualStart = utils.getAttributeValue("actualstart");
                    if (actualStart == null) {
                        utils.setAttributeValue("actualstart", currentTime);
                    }
                }
            }

            //Comment this section out on 06/01/2020 as it causes an error now div has been removed.
            //Update the text message in the div
            // document.getElementById("dfe_closePhonecallUserPrompt").innerHTML = "Select an Outcome code for this call and it will be automatically</br>saved, marked as completed and closed.";

            var formType = utils.getFormType();
            if (formType == 1 || formType == 2) {
                    utils.setAttributeValue("statuscode", 2);
                    utils.setAttributeValue("statecode", 1);
                    parent.Xrm.Page.data.entity.save("saveandclose");
            }
        }



        // We assume that the arrayOfKeyPairs is an array with contents that have value and text
        // e.g kvp.value and kvp.text
        function addOptionsToDropDownList(dropDownName, arrayOfKeyPairs)
        {
            // remove all options from dropdown menu
            $("#"+ dropDownName).children().remove().end();

            // add options to dropdown menu
            $.each(arrayOfKeyPairs, function( index, kvp ) {
                $("#" + dropDownName ).append($('<option>', {
                    value: kvp.value , text: kvp.text
                }));

            });
        }

        function onEmailTemplateSelect()
        {
            var utils = dfe_common.utils(parent);
            var emailTemplateValue = $("#selectEmailTemplate").val();
            var dataCapturePoints = emailTemplateValue;

            utils.setAttributeValue("dfe_selectedemailtemplate", dataCapturePoints);
        }

        function onDataCaptureSelect()
        {
            var utils = dfe_common.utils(parent);
            var multipleValues = $( "#selectDiscussionPoints" ).val() || [];
            var dataCapturePoints = multipleValues.join( ";" );

            utils.setAttributeValue("dfe_selecteddiscussionpoints", dataCapturePoints);
        }
    </script>
    <style>
        .tooltip {
            position: relative;
            display: inline-block;
            border-bottom: 1px dotted black;
            top: -30px;
            left: 10px;
        }

            .tooltip .tooltiptext {
                visibility: hidden;
                width: 120px;
                background-color: #a4aeb8;
                color: #fff;
                text-align: center;
                border-radius: 6px;
                padding: 5px 0;
                left: -120px;
                top: -160px;
                size: 0.2em;
                /* Position the tooltip */
                position: absolute;
                z-index: 1;
            }

            .tooltip:hover .tooltiptext {
                visibility: visible;
            }
    </style>
</head>

<body style="overflow-wrap: break-word;">
    <div id="closedPhoneCallPanel" class="controlpanel">
        <h3 style="margin: 0; color: #000000;">Select Email Template</h3>
        <p style="font-family: Segoe UI, Arial, sans-serif; font-size: 14px;">
            Select the email template used for
            the data capture.
        </p>

        <!-- TODO The list below will be dynamically generated -->
        <br />
        <select id="selectEmailTemplate" size="10"></select>
        <!-- TODO The list below will be dynamically generated -->
        <p style="font-family: Segoe UI, Arial, sans-serif; font-size: 14px;">Select options for data capture</p>
        <select id="selectDiscussionPoints" size="10" multiple></select>
        <br />
        <br />
        <button style="background-color: #3B79B7; border-color: #3B79B7;" type="button" id="DFE-btn-ConfirmDataCapture"
                value="Close call" class="button"
                title="Mark this phone call as complete and record the outcome." onclick="closephonecall_onClick(true)">
            Generate and Close
        </button>
        <span style="font-family: Segoe UI, Arial, sans-serif; font-size: 14px;">OR</span>
        <button style="background-color: #3B79B7; border-color: #3B79B7;" type="button" id="DFE-btn-ConfirmDataCapture_1"
                value="Close call" class="button"
                title="Mark this phone call as complete and record the outcome." onclick="closephonecall_onClick()">
            Close &nbsp;
        </button>
        <div class="tooltip">
            &#x1F6C8;
            <span class="tooltiptext">Generate and Close - Generates the email with selective discussion points and marks the call as closed, whilst closed marks the call as closed. </span>
        </div>
    </div>
</body>

</html>
